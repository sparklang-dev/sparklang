<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
 <title id="title">Ears / STT dataflow</title>
 <desc id="desc">WAV or mic into sidecar, SPARK_STT_CMD, whisper, or gated HTTP, then VM transcript binding.</desc>
 <defs>
 <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
 </marker>
 </defs>
 <rect width="880" height="300" fill="#f8fafc"/>
 <text x="24" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Ears  STT / audio in</text>
 <text x="24" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Dry stub in CI · live forks ./spark-stt-tts · net OFF unless gated</text>

 <rect x="40" y="100" width="140" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
 <text x="110" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">WAV / mic</text>
 <text x="110" y="148" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">arecord 16 kHz</text>

 <rect x="230" y="80" width="120" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
 <text x="290" y="110" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#1e293b">sidecar .txt</text>

 <rect x="230" y="140" width="120" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
 <text x="290" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#1e293b">STT_CMD</text>

 <rect x="230" y="200" width="120" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
 <text x="290" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#1e293b">whisper</text>

 <rect x="400" y="140" width="140" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
 <text x="470" y="162" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a3412">HTTP STT</text>
 <text x="470" y="178" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#c2410c">SPARK_STT_NET=1</text>

 <rect x="600" y="120" width="220" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
 <text x="710" y="155" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#064e3b">VM bind · transcript</text>
 <text x="710" y="178" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">listen & -&gt; var</text>

 <line x1="180" y1="132" x2="230" y2="104" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="180" y1="132" x2="230" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="180" y1="132" x2="230" y2="224" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="350" y1="164" x2="400" y2="164" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ae)"/>
 <line x1="350" y1="104" x2="600" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="350" y1="164" x2="600" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="350" y1="224" x2="600" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#ae)"/>
 <line x1="540" y1="164" x2="600" y2="164" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ae)"/>
</svg>
