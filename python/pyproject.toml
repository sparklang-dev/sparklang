[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklang"
version = "0.6.10"
description = "Host embed: run SparkLang (.spark) from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SparkLang" }]
keywords = ["spark", "sparklang", "embed", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://sparklang.dev/"
Source = "https://github.com/sparklang-dev/sparklang"

[project.scripts]
sparklang = "sparklang.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparklang*"]
