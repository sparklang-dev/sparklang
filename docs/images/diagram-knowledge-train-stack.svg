<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
 <title id="t">LLM training stack</title>
 <desc id="d">Pretrain then SFT then preference alignment then optional PEFT adapters.</desc>
 <rect width="900" height="380" fill="#f8fafc"/>
 <text x="24" y="32" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Training stack (industry sketch)</text>
 <text x="24" y="52" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Spark CPU methods ≠ this stack</text>
 <rect x="40" y="90" width="180" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
 <text x="130" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">1. Pretrain</text>
 <text x="130" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">next-token CE</text>
 <text x="130" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">web-scale corpus</text>
 <rect x="260" y="90" width="180" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
 <text x="350" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#78350f">2. SFT</text>
 <text x="350" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#92400e">instruction demos</text>
 <text x="350" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#92400e">supervised CE</text>
 <rect x="480" y="90" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
 <text x="570" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#064e3b">3. Align</text>
 <text x="570" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">RLHF / RLAIF / DPO</text>
 <text x="570" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">preferences</text>
 <rect x="700" y="90" width="160" height="100" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
 <text x="780" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#701a75">4. PEFT</text>
 <text x="780" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#86198f">LoRA / QLoRA</text>
 <text x="780" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#86198f">optional adapters</text>
 <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
 <line x1="220" y1="140" x2="260" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#b)"/>
 <line x1="440" y1="140" x2="480" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#b)"/>
 <line x1="660" y1="140" x2="700" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#b)"/>
 <rect x="40" y="240" width="820" height="100" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
 <text x="60" y="275" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Spark parallel (honest)</text>
 <text x="60" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#334155">Owned TinyCoder + five CPU reference methods + multi-outer SGD fixtures — not LoRA theater, not InstructGPT-scale RLHF.</text>
 <text x="60" y="322" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">See /docs/spark-coder.html · /docs/train-loop.html · /docs/factory.html</text>
</svg>