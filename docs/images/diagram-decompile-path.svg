<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="t2 d2">
 <title id="t2">SparkLang decompile path</title>
 <desc id="d2">SPARK_BC to dump inspect readable view optional edit then recompile</desc>
 <defs>
 <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
 <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
 </marker>
 <style>
 .box { fill:#fff; stroke:#334155; stroke-width:1.5; rx:6; }
 .hl { fill:#dcfce7; stroke:#166534; stroke-width:1.5; rx:6; }
 .opt { fill:#fff; stroke:#64748b; stroke-width:1.5; rx:6; stroke-dasharray:5 3; }
 .helper { fill:#e0f2fe; stroke:#0369a1; stroke-width:1.5; rx:6; stroke-dasharray:4 3; }
 .lbl { font:600 13px ui-sans-serif,system-ui,sans-serif; fill:#0f172a; }
 .sub { font:11px ui-sans-serif,system-ui,sans-serif; fill:#475569; }
 .cap { font:12px ui-sans-serif,system-ui,sans-serif; fill:#334155; }
 .flow { stroke:#334155; stroke-width:1.75; fill:none; marker-end:url(#arrow2); }
 </style>
 </defs>
 <rect x="8" y="8" width="904" height="224" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
 <text x="20" y="28" class="cap">Decompile / inspect path (deterministic SoT)  Spark / SparkLang</text>

 <rect class="box" x="24" y="56" width="110" height="52"/>
 <text x="79" y="78" text-anchor="middle" class="lbl">.sparkbc</text>
 <text x="79" y="94" text-anchor="middle" class="sub">SPARK_BC</text>

 <path class="flow" d="M138 82 H166"/>

 <rect class="hl" x="170" y="48" width="150" height="68"/>
 <text x="245" y="72" text-anchor="middle" class="lbl">dump.py</text>
 <text x="245" y="90" text-anchor="middle" class="sub">disasm / inspect</text>
 <text x="245" y="106" text-anchor="middle" class="sub">bc_dump.format_dump</text>

 <path class="flow" d="M324 82 H352"/>

 <rect class="hl" x="356" y="48" width="150" height="68"/>
 <text x="431" y="72" text-anchor="middle" class="lbl">Readable view</text>
 <text x="431" y="90" text-anchor="middle" class="sub">hex + mnemonics</text>
 <text x="431" y="106" text-anchor="middle" class="sub">stub JSON / --run-bc</text>

 <path class="flow" d="M510 82 H538"/>

 <rect class="opt" x="542" y="48" width="130" height="68"/>
 <text x="607" y="72" text-anchor="middle" class="lbl">Optional edit</text>
 <text x="607" y="90" text-anchor="middle" class="sub">change .spark</text>
 <text x="607" y="106" text-anchor="middle" class="sub">not lossless BC·src</text>

 <path class="flow" d="M676 82 H704"/>

 <rect class="box" x="708" y="56" width="120" height="52"/>
 <text x="768" y="78" text-anchor="middle" class="lbl">Recompile</text>
 <text x="768" y="94" text-anchor="middle" class="sub">--compile again</text>

 <rect class="helper" x="24" y="152" width="200" height="60"/>
 <text x="124" y="174" text-anchor="middle" class="lbl">CLI primary today</text>
 <text x="124" y="192" text-anchor="middle" class="sub">tools/spark-bc-dump/dump.py</text>

 <rect class="helper" x="244" y="152" width="220" height="60"/>
 <text x="354" y="174" text-anchor="middle" class="lbl">SDK-IDE GUI</text>
 <text x="354" y="192" text-anchor="middle" class="sub">Decompile .sparkbc button</text>

 <rect class="helper" x="484" y="152" width="240" height="60"/>
 <text x="604" y="174" text-anchor="middle" class="lbl">Not claimed</text>
 <text x="604" y="192" text-anchor="middle" class="sub">lossless source recovery</text>

 <text x="740" y="186" class="sub">ELF out/decompile ` SPARK_BC</text>
</svg>
