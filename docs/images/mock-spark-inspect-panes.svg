<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="tpane dpane">
  <title id="tpane">Spark inspect panes  dump and function view</title>
  <desc id="dpane">Mock of SparkLang dump hex and function list panes using SPARK_BC capture style, not foreign decompiler UI</desc>
  <defs>
    <style>
      .chrome { fill:#2c2c2c; }
      .body { fill:#1a1a1a; }
      .pane { fill:#111111; stroke:#3a3a3a; stroke-width:1; }
      .tab { fill:#3a3a3a; }
      .tab-on { fill:#e85d04; }
      .t { font:11px ui-monospace,Menlo,Consolas,monospace; fill:#d5d9e0; }
      .t-dim { font:11px ui-monospace,Menlo,Consolas,monospace; fill:#8a9099; }
      .t-hi { font:11px ui-monospace,Menlo,Consolas,monospace; fill:#ffb347; }
      .t-ok { font:11px ui-monospace,Menlo,Consolas,monospace; fill:#7dcea0; }
      .title { font:600 12px ui-sans-serif,system-ui,sans-serif; fill:#ffffff; }
      .badge { font:700 10px ui-sans-serif,system-ui,sans-serif; fill:#fff4ed; }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="360" rx="10" class="chrome"/>
  <text x="16" y="24" class="title">spark-bc-gui · SPARK_BC inspect</text>
  <text x="780" y="24" class="badge">Spark only</text>

  <rect x="12" y="40" width="440" height="300" rx="6" class="pane"/>
  <rect x="12" y="40" width="110" height="26" class="tab-on"/>
  <text x="28" y="57" class="badge">dump</text>
  <rect x="122" y="40" width="90" height="26" class="tab"/>
  <text x="140" y="57" class="t-dim">hex</text>
  <text x="28" y="90" class="t-dim"># magic SPBC · version 1</text>
  <text x="28" y="110" class="t">00000000: 53 50 42 43 01 09 00 04</text>
  <text x="28" y="128" class="t">00000008: 00 63 6f 64 65 03 00 6a</text>
  <text x="28" y="146" class="t-hi">00000010: 6f 62 11 00 73 70 61 72</text>
  <text x="28" y="164" class="t">00000018: 6b 5f 64 69 73 74 69 6c</text>
  <text x="28" y="182" class="t-ok">## Header</text>
  <text x="28" y="200" class="t">magic: SPBC</text>
  <text x="28" y="218" class="t">nstrings: 9 · nconsts: 9</text>
  <text x="28" y="236" class="t">ncode: 28 · code_off: 173</text>
  <text x="28" y="262" class="t-dim">tools/spark-bc-dump/dump.py</text>
  <text x="28" y="280" class="t-dim">examples/spark_train_step.sparkbc</text>
  <text x="28" y="308" class="t-dim">Not pseudo-C · not malware RE</text>

  <rect x="468" y="40" width="440" height="300" rx="6" class="pane"/>
  <rect x="468" y="40" width="130" height="26" class="tab-on"/>
  <text x="484" y="57" class="badge">functions</text>
  <rect x="598" y="40" width="100" height="26" class="tab"/>
  <text x="616" y="57" class="t-dim">opcodes</text>
  <text x="484" y="90" class="t-hi">TRAIN</text>
  <text x="560" y="90" class="t-dim">spark_distill_cpu</text>
  <text x="484" y="112" class="t">STEP</text>
  <text x="560" y="112" class="t-dim">job-dry-001</text>
  <text x="484" y="134" class="t">TRAIN_STATUS</text>
  <text x="584" y="134" class="t-dim">’ status</text>
  <text x="484" y="164" class="t-ok">strings</text>
  <text x="484" y="182" class="t">code · job · spark_distill_cpu</text>
  <text x="484" y="200" class="t">out/train/job-dry-001</text>
  <text x="484" y="218" class="t">fixture-base · dataset.jsonl</text>
  <text x="484" y="248" class="t-dim">Owned spark-coder is tiny.</text>
  <text x="484" y="266" class="t-dim">Does not claim to beat Claude.</text>
  <text x="484" y="292" class="t-dim">Dry-run fixtures · no API keys</text>
  <text x="484" y="318" class="t-dim">./spark --dry-run &</text>
</svg>
