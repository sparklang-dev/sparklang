<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Multimodal IO</title>
  <desc id="d">Speech and vision encoders feed a shared language model; TTS speaks outputs.</desc>
  <rect width="880" height="300" fill="#f8fafc"/>
  <text x="24" y="32" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Multimodal I/O (STT · vision · TTS)</text>
  <text x="24" y="52" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Spark: ears/speaking live-gated · eyes stub · see /docs/voice.html</text>
  <rect x="40" y="100" width="140" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">Audio</text>
  <text x="110" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">STT / ASR</text>
  <rect x="40" y="200" width="140" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="110" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#78350f">Image</text>
  <rect x="260" y="130" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="360" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#064e3b">Language model</text>
  <text x="360" y="192" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">shared token space</text>
  <rect x="540" y="130" width="140" height="90" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="610" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#701a75">Text out</text>
  <text x="610" y="192" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#86198f">+ tool calls</text>
  <rect x="720" y="130" width="120" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="780" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e293b">TTS</text>
  <text x="780" y="192" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#334155">speak</text>
  <defs><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
  <line x1="180" y1="135" x2="260" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#e)"/>
  <line x1="180" y1="225" x2="260" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#e)"/>
  <line x1="460" y1="175" x2="540" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#e)"/>
  <line x1="680" y1="175" x2="720" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#e)"/>
</svg>