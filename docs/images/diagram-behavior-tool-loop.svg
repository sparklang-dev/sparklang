<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
 <title id="title">Spark behavior and tool loop</title>
 <desc id="desc">User input through behavior policy, ask/classify, tool registry, outputs, plus train and eval measurement loop.</desc>
 <defs>
 <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
 </marker>
 </defs>
 <rect width="880" height="360" fill="#f8fafc"/>
 <text x="24" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Behavior + tool loop</text>
 <text x="24" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Dry tools return stub:local · eval never publishes a marketing win</text>

 <rect x="40" y="90" width="160" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
 <text x="120" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">Input</text>
 <text x="120" y="142" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">text · transcript</text>

 <rect x="260" y="90" width="180" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
 <text x="350" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#78350f">Behavior policy</text>
 <text x="350" y="142" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#92400e">reply pack · abstain · SoT</text>

 <rect x="500" y="90" width="160" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
 <text x="580" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#064e3b">ask / classify</text>
 <text x="580" y="142" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">extract · expect</text>

 <rect x="720" y="90" width="120" height="70" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
 <text x="780" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#701a75">Output</text>
 <text x="780" y="142" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#86198f">print · speak · http</text>

 <line x1="200" y1="125" x2="260" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
 <line x1="440" y1="125" x2="500" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
 <line x1="660" y1="125" x2="720" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

 <rect x="500" y="210" width="160" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
 <text x="580" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e293b">tool registry</text>
 <text x="580" y="262" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#334155">with tools [&]</text>

 <path d="M 580 160 L 580 210" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)" fill="none"/>
 <path d="M 500 245 L 470 245 L 470 125 L 500 125" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

 <rect x="40" y="210" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
 <text x="140" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#064e3b">Train (STEP / methods)</text>
 <text x="140" y="262" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">CPU SGD · reply pack</text>

 <rect x="280" y="210" width="160" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
 <text x="360" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Eval harness</text>
 <text x="360" y="262" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#991b1b">scores only · not win</text>

 <line x1="240" y1="245" x2="280" y2="245" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>
 <path d="M 360 210 L 360 175 L 350 160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow2)"/>

 <text x="24" y="330" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">I/K helper shadows wrap factory tools  they do not replace .spark behavior policy.</text>
</svg>
