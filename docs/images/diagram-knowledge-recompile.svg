<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d">
 <title id="t">Recompile is not semantics</title>
 <desc id="d">Pretty recompilable LLM decompile can still diverge from original behavior.</desc>
 <rect width="900" height="320" fill="#f8fafc"/>
 <text x="24" y="32" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Recompile ≠ semantic fidelity</text>
 <text x="24" y="52" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Spark SoT: dump / --run-bc · LLM assist only · cite arXiv:2609.05370</text>
 <rect x="40" y="90" width="160" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
 <text x="120" y="125" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">Binary</text>
 <text x="120" y="147" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#075985">SPARK_BC / ELF</text>
 <rect x="250" y="90" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
 <text x="340" y="125" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#78350f">LLM decompile</text>
 <text x="340" y="147" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#92400e">pretty C source</text>
 <rect x="480" y="90" width="160" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
 <text x="560" y="125" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#064e3b">Recompile</text>
 <text x="560" y="147" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#065f46">passes shipped tests</text>
 <rect x="690" y="90" width="170" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
 <text x="775" y="125" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">May still diverge</text>
 <text x="775" y="147" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#991b1b">fuzz / CVE behavior</text>
 <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
 <line x1="200" y1="130" x2="250" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
 <line x1="430" y1="130" x2="480" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
 <line x1="640" y1="130" x2="690" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
 <text x="40" y="230" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#334155">Traditional dump leaves unknowns visible. LLM may invent fields/guards that hide crashes.</text>
 <text x="40" y="258" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Full survey: /docs/llm-decompile.html · Spark dump how-to: /docs/decompile.html</text>
 <text x="40" y="286" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Not an OpenBin clone. Commercial tools are third-party reading only.</text>
</svg>