<html>
<head>
<title>CSS fixture</title>
<style>
p{color:#0000c8;font-size:18px;margin:4px;padding:6px;width:40px;min-width:200px;min-height:56px;background-color:#00c8c8}
span{display:inline;color:green}
div{display:block;padding:8px;background-color:#00c800;width:120px;max-width:80px;height:48px;max-height:40px}
img{display:inline-block}
table{display:table}
tr{display:table-row}
td{display:table-cell;padding:4px;border-width:2px;border-color:#c80000;border-style:solid;background-color:#00c800;width:320px;height:48px}
th{display:table-cell;padding:4px;border-width:2px;border-color:#c80000;border-style:none;width:320px;height:48px}
</style>
</head>
<body>
<div>block</div>
<p style="color:#c80000;font-size:20px">hi</p>
<span style="margin:2px">x</span>
<img src="x.png" alt="i" />
<table>
<tr><th>h</th><td>c</td></tr>
</table>
<span style="display:none">gone</span>
<div style="visibility:hidden;background-color:#c800c8;width:40px;max-width:40px;height:24px;max-height:24px;padding:0">hid</div>
<div style="opacity:0;background-color:#c80080;width:40px;max-width:40px;height:24px;max-height:24px;padding:0">op0</div>
<div style="background-color:transparent;width:40px;max-width:40px;height:24px;max-height:24px;padding:0">tr</div>
<span style="color:yellow">Y</span>
<span style="color:transparent">T</span>
<span style="color:cyan">C</span>
<span style="color:magenta">M</span>
<span style="color:orange">O</span>
<span style="color:lime">L</span>
</body>
</html>
