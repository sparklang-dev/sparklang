<html>
<head>
<title>Table demo</title>
<style>
table{display:table}
tr{display:table-row}
td{display:table-cell;padding:4px;border-width:2px;background-color:#00c800;width:320px;height:48px}
th{display:table-cell;padding:4px;border-width:2px;width:320px;height:48px}
</style>
</head>
<body>
<p style="color:#c80000;font-size:20px">.</p>
<table>
<tr><th>A</th><th>B</th></tr>
<tr><td>1</td><td>2</td></tr>
</table>
</body>
</html>
