# SPARK_BC gate — Makefile targets only; no secrets / no live gateway.
name: sparkbc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sparkbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build-essential: cc/make for spark-bootstrap; as/ld for GAS ./spark
      # (test-sparkbc depends on both). python3 is on the runner image.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: make test-sparkbc
        run: make test-sparkbc

      - name: make sparkbc-e2e
        run: make sparkbc-e2e

      - name: make spark-eval
        run: make spark-eval

      - name: make test-spark-eval
        run: make test-spark-eval

      # Claude baseline auto-skips without secrets (honest status).
      - name: make spark-eval-claude
        run: make spark-eval-claude

      - name: make test-serve-api
        run: make test-serve-api

      # SDK + IDE + GUI download pack (manifest paths + headless core).
      - name: make test-sdk-pack
        run: make test-sdk-pack

      # K-lane helpers / shadows / kit smoke + pack stage
      - name: make tools-test
        run: make tools-test

      - name: make sdk-pack
        run: make sdk-pack

      # Owned TinyCoder (M-lane)
      - name: make test-spark-coder
        run: make test-spark-coder

      # Voice ask loop (STT/TTS dry + dump context)
      - name: make test-spark-ask
        run: make test-spark-ask

      # JS/Python SPARK_BC parser parity (website/js/sparkbc.js vs
      # bc_dump.py on published fixtures; node is on the runner).
      - name: make test-js-parity
        run: make test-js-parity
# Voice easy — owned STT/TTS heads (tiny dry; never 6000)
      - name: make test-voice-easy
        run: make test-voice-easy
